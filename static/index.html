<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mum's Plant Care</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Plant Care">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.json">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f4;
      color: #2c3e50;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { max-width: 480px; width: 100%; }
    header { text-align: center; margin: 16px 0 20px; }
    h1 { font-size: 24px; color: #1b4332; }
    
    .btn-camera {
      width: 100%;
      padding: 18px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 16px;
      background-color: #2d6a4f;
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(45, 106, 79, 0.25);
    }

    #loading { display: none; text-align: center; margin: 24px 0; font-weight: 500; color: #2d6a4f; }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      display: none;
    }
    
    #user-photo-preview {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .plant-title { font-size: 22px; color: #1b4332; margin-bottom: 6px; }
    .quick-summary { font-size: 15px; color: #4a5568; margin-bottom: 16px; line-height: 1.4; }

    /* Quick Badges */
    .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      background-color: #e8f5e9;
      color: #1b4332;
    }
    .badge-warning { background-color: #fff3e0; color: #e65100; }

    /* Accordion Details */
    details {
      border-top: 1px solid #edf2f7;
      padding: 12px 0;
    }
    summary {
      font-size: 16px;
      font-weight: 700;
      color: #2d6a4f;
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: '＋'; font-size: 18px; }
    details[open] summary::after { content: '－'; }
    
    .detail-content { font-size: 15px; color: #334155; margin-top: 10px; line-height: 1.5; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🌸 Plant Care Finder</h1>
    </header>

    <input type="file" accept="image/*" capture="environment" id="camera-input" style="display: none;">
    <button class="btn-camera" onclick="document.getElementById('camera-input').click()">
      📷 Take Plant Photo
    </button>

    <div id="loading">Analyzing your plant...</div>

    <div class="card" id="results-card">
      <img id="user-photo-preview" src="" alt="Captured Plant Photo">
      <h2 class="plant-title" id="res-name"></h2>
      <p class="quick-summary" id="res-summary"></p>

      <!-- At a glance badges -->
      <div class="badges">
        <span class="badge" id="badge-difficulty">⭐ Easy</span>
        <span class="badge" id="badge-sun">☀️ Full Sun</span>
        <span class="badge" id="badge-pet">🐶 Safe for Pets</span>
      </div>

      <!-- Expandable Detailed Sections -->
      <details open>
        <summary>💧 Watering Needs</summary>
        <div class="detail-content" id="res-water"></div>
      </details>

      <details>
        <summary>🌱 Planting & Timing</summary>
        <div class="detail-content" id="res-planting"></div>
      </details>

      <details>
        <summary>🌸 Flowering Period</summary>
        <div class="detail-content" id="res-flowering"></div>
      </details>

      <details>
        <summary>✂️ Pruning & Deadheading</summary>
        <div class="detail-content" id="res-pruning"></div>
      </details>

      <details>
        <summary>🐛 Pests & Troubleshooting</summary>
        <div class="detail-content" id="res-pests"></div>
      </details>
    </div>
  </div>

  <script>
    const cameraInput = document.getElementById('camera-input');
    const loading = document.getElementById('loading');
    const card = document.getElementById('results-card');
    const photoPreview = document.getElementById('user-photo-preview');

    cameraInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Local preview of captured photo
      photoPreview.src = URL.createObjectURL(file);
      card.style.display = 'none';
      loading.style.display = 'block';

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/api/identify', { method: 'POST', body: formData });
        if (!res.ok) throw new Error('API Request Failed');
        
        const data = await res.json();

        document.getElementById('res-name').innerText = data.plant_name || 'Plant Identified';
        document.getElementById('res-summary').innerText = data.quick_summary || '';
        
        // Badges
        document.getElementById('badge-difficulty').innerText = `⭐ ${data.care_difficulty || 'Moderate'}`;
        document.getElementById('badge-sun').innerText = `☀️ ${data.sunlight || 'Sun/Shade'}`;
        
        const petBadge = document.getElementById('badge-pet');
        petBadge.innerText = `🐾 ${data.pet_safety || 'Pet Safety Unknown'}`;
        if (data.pet_safety && data.pet_safety.toLowerCase().includes('toxic')) {
          petBadge.className = 'badge badge-warning';
        } else {
          petBadge.className = 'badge';
        }

        // Details
        document.getElementById('res-water').innerText = data.watering_needs || 'N/A';
        document.getElementById('res-planting').innerText = data.best_time_to_plant || 'N/A';
        document.getElementById('res-flowering').innerText = data.flowering_duration || 'N/A';
        document.getElementById('res-pruning').innerText = data.pruning_advice || 'N/A';
        document.getElementById('res-pests').innerText = data.common_pests || 'N/A';

        loading.style.display = 'none';
        card.style.display = 'block';
      } catch (err) {
        loading.style.display = 'none';
        alert('Could not identify the image. Please try again with a clearer photo.');
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
